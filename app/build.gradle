plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.apax.core'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.apax.core"
        // Walmart 100011886 tablet typically runs Android 11 (API 30) or higher
        minSdk 30  // Android 11 - optimized for Walmart 100011886 tablet
        targetSdk 36
        versionCode 1
        versionName "1.0.0-walmart-tablet"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Native build configuration for apax_core
        // Walmart 100011886 tablet uses ARM-based CPU
        // Prioritize arm64-v8a for optimal performance on this device
        ndk {
            abiFilters 'arm64-v8a'  // Primary ABI for Walmart 100011886 tablet
        }

        // Tablet-specific configuration
        resConfigs "en", "xxhdpi"  // Optimize APK size for tablet resolution
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Tablet-specific optimizations
            ndk {
                debugSymbolLevel 'FULL'  // Better debugging on device
            }
        }
        debug {
            // Debug build for development on Walmart tablet
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    // Screen size configuration for Walmart 100011886 tablet
    // Typical resolution: 1280x800 (WXGA)
    defaultConfig {
        vectorDrawables.useSupportLibrary = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout

    // CameraX dependencies for continuous video capture
    // CameraX provides a consistent, easy-to-use API for camera access
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    // Concurrent futures for camera operations
    implementation "androidx.concurrent:concurrent-futures:1.1.0"
    implementation "com.google.guava:guava:31.1-android"

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}